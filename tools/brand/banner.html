<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Inter; src: url(inter.woff2) format('woff2'); font-weight: 100 900; }
html,body { margin:0; }
.b { position:relative; width:772px; height:250px; overflow:hidden; font-family: Inter, sans-serif;
  background: radial-gradient(circle at 78% 40%, rgba(83,166,216,.20), transparent 38%), linear-gradient(125deg, #10233f 0%, #16243a 40%, #203a5a 100%); }
.rings { position:absolute; right:-120px; top:-150px; width:520px; height:520px; border-radius:50%; border:1px solid rgba(114,174,230,.16);
  box-shadow: 0 0 0 46px rgba(114,174,230,.045), 0 0 0 92px rgba(114,174,230,.03); }
.dots { position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 18px 18px;
  -webkit-mask-image: linear-gradient(90deg, transparent 40%, #000 100%); mask-image: linear-gradient(90deg, transparent 40%, #000 100%); }
.mark { position:absolute; left:44px; top:47px; width:156px; height:156px; border-radius:30px; overflow:hidden; box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(114,174,230,.25); }
.txt { position:absolute; left:230px; top:62px; right:30px; }
.lock { display:flex; align-items:center; white-space:nowrap; font-size:36px; letter-spacing:-.01em; line-height:1; }
.name { color:#22c55e; font-weight:600; }
.sep { width:2px; height:34px; margin:0 16px; background:rgba(255,255,255,.35); border-radius:2px; }
.prod { color:#f1f6fb; font-weight:500; }
.tag { margin-top:16px; color:#c9d8e8; font-size:18px; font-weight:400; }
.chips { display:flex; gap:8px; margin-top:22px; }
.chip { padding:5px 11px; border-radius:999px; border:1px solid rgba(114,174,230,.30); background:rgba(114,174,230,.08); color:#b8d4ee; font-size:11.5px; font-weight:500; letter-spacing:.01em; }
.chip b { color:#22c55e; font-weight:700; }
</style></head><body><div class="b"><div class="dots"></div><div class="rings"></div>
<div class="mark"><!-- ICON_SVG --></div>
<div class="txt"><div class="lock"><span class="name">Dr. Speed</span><span class="sep"></span><span class="prod">AI Assets Scanner</span></div>
<div class="tag">Safely debloat your pages with one push of a button.</div>
<div class="chips"><span class="chip"><b>✓</b> Per-page CSS &amp; JS rules</span><span class="chip"><b>✓</b> Safe or aggressive</span><span class="chip"><b>✓</b> One-click undo</span></div></div>
</div></body></html>
